[project]
name = "pr-agent"
version = "0.1.0"
description = "PR assistant: a Strands agent that helps requestors fill in a purchase request. Read-only on SAP."
requires-python = ">=3.13"
dependencies = [
    "bedrock-agentcore>=1.25.4",
    "boto3>=1.43.127",
    "botocore[crt]>=1.43.127",
    "mcp>=2.3.0",
    "strands-agents>=1.64.0",
]

[project.scripts]
pr-agent = "pr_agent.app:main"
pr-agent-evals = "pr_agent.evals:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
